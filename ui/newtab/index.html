<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: zen:; style-src 'self'; script-src 'self'; font-src 'self'">
<title>แท็บใหม่</title>
<link rel="stylesheet" href="../shared/tokens.css">
<link rel="stylesheet" href="./newtab.css">
</head>
<body>
<main class="nt">
  <section class="clock" aria-live="off">
    <div class="time" id="time">--:--</div>
    <div class="date" id="date"></div>
  </section>

  <form class="search" id="search" role="search">
    <i data-icon="search" data-size="18" data-stroke="1.8"></i>
    <label for="q" class="sr-only">ค้นหาหรือพิมพ์ที่อยู่เว็บ</label>
    <input id="q" autocomplete="off" spellcheck="false" placeholder="ค้นหา หรือพิมพ์ที่อยู่เว็บ" autofocus>
    <button type="button" class="engine" id="engine">DuckDuckGo</button>
  </form>

  <nav class="sites" id="sites" aria-label="เว็บที่ใช้บ่อย"></nav>

  <section class="stats" aria-label="สถิติ ZEO Shields">
    <div><b class="accent" id="st-blocked">0</b><span>โฆษณาและตัวติดตามที่บล็อก</span></div>
    <i class="sep"></i>
    <div><b id="st-bytes">0 MB</b><span>ข้อมูลที่ประหยัดได้</span></div>
    <i class="sep"></i>
    <div><b id="st-time">0 นาที</b><span>เวลาที่ประหยัดได้</span></div>
  </section>
</main>
<script src="../shared/icons.js"></script>
<script src="../shared/bridge.js"></script>
<script src="./newtab.js"></script>
</body>
</html>
